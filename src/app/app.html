<div class="cad-shell">
  <app-chrome (openStepFile)="onOpenStepFile()"></app-chrome>

  <div class="cad-main" [style.grid-template-columns]="gridTemplateColumns()">
    <app-side-panels
      (deletePart)="onDeletePart($event)"
      (treeWidthChange)="onTreeWidthChange($event)"
      (propertiesWidthChange)="onPropertiesWidthChange($event)"
    ></app-side-panels>
    <app-viewport></app-viewport>
  </div>
</div>
